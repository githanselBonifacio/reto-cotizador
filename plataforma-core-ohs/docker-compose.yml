# Docker Compose Configuration for development

version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb-catalogo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-ohs_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-this-local-password}
      MONGO_INITDB_DATABASE: CATALOGO_DANOS
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: plataforma-core-ohs
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:-ohs_admin}:${MONGO_ROOT_PASSWORD:-change-this-local-password}@mongodb:27017/?authSource=admin
      DATABASE_NAME: CATALOGO_DANOS
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production-min-32-chars}
      API_KEY: ${API_KEY:-your-api-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      APP_NAME: Plataforma Core OHS
      APP_VERSION: 1.0.0
      DEBUG: False
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mongodb_data:
    driver: local

networks:
  app-network:
    driver: bridge

