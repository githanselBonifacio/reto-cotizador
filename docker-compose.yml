services:
  # Database initialization service - runs once to seed both databases
  db-init:
    build:
      context: .
      dockerfile: Dockerfile.init
    container_name: reto-db-init
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      DATABASE_NAME: CATALOGO_DANOS
      SPRING_DATABASE: PLATAFORMA_DANOS
    restart: "no"  # Run only once at startup
    networks:
      - default

  mongodb:
    image: mongo:7
    container_name: reto-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  plataforma-core-ohs:
    build:
      context: ./plataforma-core-ohs
      dockerfile: Dockerfile
    container_name: reto-core-ohs
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      DATABASE_NAME: CATALOGO_DANOS
      DEBUG: "True"
      APP_NAME: Plataforma Core OHS
      APP_VERSION: 1.0.0
      SECRET_KEY: your-secret-key-change-in-production-min-32-chars-long
      API_KEY: your-api-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      CORS_ORIGINS: '["*"]'
      ALLOWED_HOSTS: '["*"]'
    ports:
      - "8000:8000"

  cotizador-danos-back:
    image: gradle:8.14.2-jdk21
    container_name: reto-cotizador-back
    restart: unless-stopped
    working_dir: /app
    depends_on:
      mongodb:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      plataforma-core-ohs:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local
      MONGODB_URI: mongodb://mongodb:27017/PLATAFORMA_DANOS
      CORE_OHS_BASE_URL: http://plataforma-core-ohs:8000
      CORE_OHS_API_KEY: your-api-key-change-in-production
      CATALOG_BASE_URL: http://plataforma-core-ohs:8000
      CATALOG_API_KEY: your-api-key-change-in-production
    volumes:
      - ./cotizador-danos-back/cotizador-danos-back:/app
      - gradle_cache:/home/gradle/.gradle
    command: ["bash", "-lc", "chmod +x ./gradlew && ./gradlew bootRun --no-daemon"]
    ports:
      - "8080:8080"

  cotizador-danos-web:
    image: node:22-alpine
    container_name: reto-cotizador-web
    restart: unless-stopped
    working_dir: /app
    depends_on:
      db-init:
        condition: service_completed_successfully
      cotizador-danos-back:
        condition: service_started
      plataforma-core-ohs:
        condition: service_started
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./cotizador-danos-web:/app
      - web_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install && npm run start -- --host 0.0.0.0 --port 4200"]
    ports:
      - "4200:4200"

volumes:
  mongo_data:
  gradle_cache:
  web_node_modules:
