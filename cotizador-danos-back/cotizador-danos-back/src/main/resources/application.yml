spring:
  application:
    name: cotizador-danos-back
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

core-ohs:
  base-url: ${CORE_OHS_BASE_URL:http://localhost:8000}
  api-key: ${CORE_OHS_API_KEY:}
  endpoints:
    folio: /folios
    tariffs: /tariffs
    zip-code-validation: /zip-codes/{zipCode}/validate

app:
  security:
    require-api-key: ${APP_SECURITY_REQUIRE_API_KEY:false}
    api-key: ${APP_API_KEY:}